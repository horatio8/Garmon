<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Together with Garmon — SC House District 115</title>
<meta name="description" content="Johnnie Garmon for South Carolina House District 115. A better day tomorrow." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel" src="components/home.jsx"></script>
<script type="text/babel" src="components/petition.jsx"></script>
<script type="text/babel" src="components/pages.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const SITE_DEFAULTS = {
  tagline: "Together with Garmon.",
  primaryCTA: "Donate",
  heroVariant: "photoLeft",
  colorMode: "balanced",
  headlineSerif: "Source Serif 4",
  density: "regular",
  showGold: true,
  endorsementStyle: "logos",
};

const DONATE_URL = 'https://secure.anedot.com/johnnie-garmon-for-sc115/donate?exitIntent=true';
window.DONATE_URL = DONATE_URL;
window.goDonate = () => { window.location.href = DONATE_URL; };

function getRoute() {
  const h = window.location.hash.replace(/^#/, '') || '/';
  return h.startsWith('/') ? h : '/' + h;
}
window.navigate = (path) => {
  if (path === '/donate') { window.goDonate(); return; }
  window.location.hash = path;
  window.scrollTo({ top: 0, behavior: 'instant' });
};

// Auto-rolling election banner: primary first, then general.
const ELECTIONS = [
  { label: 'Primary', dateStr: 'June 9, 2026',     shortDate: 'June 9', date: new Date(2026, 5, 9) },
  { label: 'General', dateStr: 'November 3, 2026', shortDate: 'Nov 3',  date: new Date(2026, 10, 3) },
];
function getElectionInfo() {
  const now = new Date();
  const upcoming = ELECTIONS.find(e => e.date >= now) || ELECTIONS[ELECTIONS.length - 1];
  return { label: upcoming.label, dateStr: upcoming.dateStr, shortDate: upcoming.shortDate };
}

function App() {
  const t = SITE_DEFAULTS;
  const [route, setRoute] = useState(getRoute());
  const [toast, setToast] = useState('');

  useEffect(() => {
    const onHash = () => setRoute(getRoute());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const showToast = useCallback((msg) => setToast(msg), []);
  const [election, setElection] = useState(getElectionInfo);
  useEffect(() => {
    const id = setInterval(() => setElection(getElectionInfo()), 60_000);
    return () => clearInterval(id);
  }, []);

  // Donate is hosted externally (Anedot). If anyone lands on /#/donate
  // (old links, deep-linked share, etc.), bounce them to the live form.
  useEffect(() => {
    if (route === '/donate') window.location.replace(DONATE_URL);
  }, [route]);

  let page;
  if (route === '/') page = <HomePage t={t} showToast={showToast} />;
  else if (route === '/donate') page = <div style={{ padding: '120px 24px', textAlign: 'center' }}>Redirecting to the secure donation page…</div>;
  else if (route === '/petition') page = <PetitionPage showToast={showToast} />;
  else if (route === '/volunteer') page = <VolunteerPage showToast={showToast} />;
  else if (route === '/events') page = <EventsPage showToast={showToast} />;
  else if (route === '/about') page = <AboutPage />;
  else if (route === '/issues') page = <IssuesPage />;
  else if (route.startsWith('/issues/')) page = <IssueDetail slug={route.split('/')[2]} />;
  else if (route === '/news') page = <NewsPage />;
  else if (route === '/contact') page = <ContactPage />;
  else page = <HomePage t={t} showToast={showToast} />;

  return (
    <div data-screen-label={`Route ${route}`}>
      <Nav route={route} election={election} />
      {page}
      <Footer />

      <a className="sticky-donate" href={DONATE_URL}>
        <span style={{ width: 8, height: 8, background: 'var(--crimson)', borderRadius: '50%' }} className="pulse-dot" />
        Donate
      </a>

      <Toast msg={toast} onClose={() => setToast('')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
